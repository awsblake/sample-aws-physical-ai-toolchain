# Dependabot version updates for sample-aws-physical-ai-toolchain, generated by
# quinn-suite skills/validate/scripts/dependabot_rollout.py (qs-x4gs). Alerts alone never
# open PRs; this file does. Security updates only, one PR per ecosystem: the repo has no
# CI to prove a version bump green, so version updates are off (qs-33lw4).
# Re-run the script to regenerate after adding a manifest, then restore the hand-added
# terraform entry at the end, which the script does not emit.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/cdk"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
  # The docker fetcher reads every file whose name contains "dockerfile" in each listed
  # directory, so /containers/gr00t-training also covers Dockerfile.n17.
  - package-ecosystem: docker
    directories:
      - "/containers/gr00t-inference"
      - "/containers/gr00t-training"
      - "/containers/inference"
      - "/containers/isaac-lab"
      - "/containers/isaac-sim"
      - "/containers/mujoco"
      - "/notebooks/lab1/container"
      - "/notebooks/lab4/container"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  # Hand-added (sampleawsphysicalaitoolchain-23w): the generator emits no terraform
  # ecosystem, so add a new root module here by hand.
  - package-ecosystem: terraform
    directories:
      - "/cosmos-on-aws/infra"
      - "/foundation/infra"
      - "/isaac-gr00t-on-aws/infra"
      - "/isaac-lab-on-aws/infra"
      - "/isaac-sim-on-aws/infra"
      - "/mujoco-on-aws/infra"
      - "/osmo-on-aws/001-iac"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform-security:
        applies-to: security-updates
        patterns: ["*"]
